name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every job here reads the repository and nothing else: the artifact uploads go through the
# Actions runtime token rather than GITHUB_TOKEN. Stated at the top so a job added later
# inherits the narrow default instead of the broad one.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libdbus-1-dev dbus-daemon protobuf-compiler python3 python3-pip git zip libsdl2-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then sudo apt-get install -y clang lldb lld; fi
          if [ "${{ matrix.compiler }}" = "gcc" ]; then sudo apt-get install -y gcc g++; fi

      - name: Install Python packages for nanopb generator
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools jinja2 jsonschema

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then echo "CC=clang" >> $GITHUB_ENV; echo "CXX=clang++" >> $GITHUB_ENV; fi
          if [ "${{ matrix.compiler }}" = "gcc" ]; then echo "CC=gcc" >> $GITHUB_ENV; echo "CXX=g++" >> $GITHUB_ENV; fi

      - name: Build (Debug)
        run: make debug

      - name: Run tests
        run: make test

      - name: Package (Release)
        run: |
          make release
          make package

      - name: Compute version
        id: ver
        run: |
          ver=$(grep -E "^project\(meshclient VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$ver" ]; then ver="0.0.0"; fi
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Upload binary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meshclient-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.compiler }}-debug
          path: build/debug/meshclient
          if-no-files-found: ignore

      - name: Upload pak artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MeshClient.pak-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            dist/MeshClient.pak.zip
            dist/MeshClient.pak/**
          if-no-files-found: ignore

  # macOS is a development host, not a target: inkwell's loop is kqueue there, the device half
  # (fb, evdev, BlueZ, usbfs) compiles to refusals, and the UI runs in an SDL window. The suite
  # is the same suite. This job is what catches a Linux-only call - timerfd_create(), EPOLLIN,
  # SOCK_NONBLOCK - arriving above inkwell, which compiles fine on every other job here.
  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The same script a developer runs: Homebrew's packages and a .venv with the generators'
      # Python, which scripts/build.sh then finds by path.
      - name: Install dependencies
        run: ./scripts/setup-macos.sh

      - name: Build (Debug)
        run: make debug

      - name: Run tests
        run: make test

  # Keep the first native slice honest: the UCRT executable must link and the SDL event loop
  # must start even on a runner without a display or a radio. The setup script brings in Mbed
  # TLS under inkwell, so this is the build with TLS that a Windows user gets.
  windows:
    name: Build and smoke (Windows UCRT64)
    runs-on: windows-2025
    steps:
      - name: Preserve Unix line endings and enable long Git paths
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install UCRT64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-protobuf
            mingw-w64-ucrt-x86_64-python-grpcio-tools
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-python-jsonschema

      - name: Build and launch one SDL poll
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          SDL_VIDEODRIVER: dummy
        run: |
          ./scripts/setup-windows.ps1
          ./scripts/build-windows.ps1
          $env:Path = "$(Join-Path $env:MSYS2_ROOT 'ucrt64\bin');$env:Path"
          & ./build/windows-debug/meshclient.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows version smoke failed.' }
          $client = (Resolve-Path ./build/windows-debug/meshclient.exe).Path
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($backend in @('', 'auto', 'not-a-backend')) {
              if ($backend -eq '') {
                Remove-Item Env:MESHCLIENT_UI_BACKEND -ErrorAction SilentlyContinue
              } else {
                $env:MESHCLIENT_UI_BACKEND = $backend
              }
              $smoke = & $client --disable-ble --disable-serial --disable-tcp -t 1 2>&1
              $smoke | Out-Host
              if ($LASTEXITCODE -ne 0 -or
                  -not ($smoke | Where-Object { $_.ToString().Contains('SDL UI backend active') })) {
                throw "Windows smoke did not start SDL for backend '$backend'."
              }
            }
            $env:MESHCLIENT_UI_BACKEND = 'cli'
            $resolve = & $client --status --tcp-host localhost:4403 --disable-ble `
              --disable-serial --timeout 2 --log-level debug 2>&1
            $resolve | Out-Host
            if (-not ($resolve | Where-Object { $_.ToString().Contains('Looking up localhost:4403') })) {
              throw 'Windows asynchronous hostname lookup smoke failed.'
            }
          } finally {
            Pop-Location
          }

  # The two desktop downloads, built on every pull request by the scripts the release runs, so a
  # packaging break is red in review rather than after a release has already been tagged. These
  # are development builds - unstamped, so the updater inside them will not install anything -
  # and they are uploaded so a reviewer can install exactly what the change produces.
  macos-package:
    name: Package (macOS .app and .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: ./scripts/setup-macos.sh

      # The universal SDL2 the bundle carries, built from its pinned source release. Keyed on
      # the script, which holds the version, the digest and the deployment target.
      - name: Cache SDL2
        uses: actions/cache@v6
        with:
          path: build/macos-sdl2-*
          key: macos-sdl2-${{ hashFiles('scripts/package-macos.sh') }}

      - name: Build the bundle and the disk image
        run: ./scripts/package-macos.sh

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: MeshClient-macos
          path: |
            dist/MeshClient-macos.dmg
            dist/MeshClient-macos-app.zip
          if-no-files-found: error

  windows-package:
    name: Package (Windows installer)
    runs-on: windows-2025
    steps:
      - name: Preserve Unix line endings and enable long Git paths
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install UCRT64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-protobuf
            mingw-w64-ucrt-x86_64-python-grpcio-tools
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-python-jsonschema

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/setup-windows.ps1
          ./scripts/package-windows.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: MeshClient-windows
          path: |
            dist/MeshClient-windows-x86_64-setup.exe
            dist/meshclient-windows-x86_64.exe
          if-no-files-found: error

  # The device build, on every pull request. It used to run only in semantic-release.yml, which
  # fires on a push to main - so a change that compiles on glibc/x86-64 and not on musl/aarch64
  # was green in review, red at release time, and red on a protected branch. This job is the
  # same toolchain the pak is built with (docker/setup-cross.sh, what `make docker-pak` uses),
  # and it packages as well as compiles, because the pak is the thing that ships.
  # The build without Mbed TLS, which CMakeLists.txt has always claimed to support and nothing
  # checked. inkwell's `net/tls.c` compiles to a stub that reports TLS unavailable, the way the
  # BLE transport does without D-Bus headers, so a checkout that skipped the submodule still
  # builds and still runs with MQTT in plaintext.
  #
  # It is here because that claim was false for one commit and a review bot found it, not this
  # workflow: `src/core/generated/ca_roots.c` was compiled only inside the TLS block, and the
  # moment app.c registered the roots unconditionally the link broke with two undefined symbols.
  # An unchecked configuration is one nobody notices breaking, and this is the cheapest thing
  # that notices.
  #
  # The submodule is emptied rather than skipped, because the checkout needs the other four
  # (inkwell, inkcell, nanopb, protobufs) and `EXISTS .../mbedtls/CMakeLists.txt` is what the
  # build actually keys on. Mbed TLS is nested one level deeper now that TLS is inkwell's, so
  # what this empties is inkwell's submodule rather than one of this repository's.
  no-tls:
    name: Build and test (no TLS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Mbed TLS is inkwell's submodule, not this repo's, so the directory to empty is inside
      # it. Emptying rather than removing, because `actions/checkout` has already placed it and
      # deleting the path outright leaves git thinking the submodule is merely modified; what
      # the build looks for is the CMakeLists.txt inside.
      - name: Remove Mbed TLS
        run: rm -rf third_party/inkwell/third_party/mbedtls/* third_party/inkwell/third_party/mbedtls/.[!.]*

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libdbus-1-dev dbus-daemon protobuf-compiler python3 python3-pip git

      - name: Install Python packages for nanopb generator
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools jinja2 jsonschema

      # The configure log says which way it went, so a job that silently built *with* TLS -
      # which would make this check vacuous - is visible in the output rather than inferred.
      - name: Build (Debug)
        run: make debug

      - name: Run tests
        run: make test

  cross-build:
    name: Cross build (tg5040, static aarch64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config protobuf-compiler python3 python3-pip file zip

      - name: Install Python packages for nanopb generator
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools jinja2 jsonschema

      # actions/cache restores as the runner user, and /opt is root's.
      - name: Prepare the toolchain directory
        run: sudo mkdir -p /opt/cross && sudo chown "$(id -u):$(id -g)" /opt/cross

      # Keyed on the setup script because it names the toolchain tarball and the dbus version:
      # bump either and the key changes. Without this every push re-downloads ~200 MB from
      # toolchains.bootlin.com and rebuilds libdbus, which also makes an unrelated PR's CI
      # depend on that host being up.
      - name: Cache the aarch64 toolchain and static libdbus
        id: cross-toolchain
        uses: actions/cache@v6
        with:
          path: /opt/cross
          key: cross-ubuntu-24.04-${{ hashFiles('docker/setup-cross.sh') }}

      - name: Build the toolchain
        if: steps.cross-toolchain.outputs.cache-hit != 'true'
        run: sudo bash docker/setup-cross.sh

      # Asserts the binary is aarch64 and static before packaging it; see scripts/cross-build.sh.
      - name: Build the pak
        run: ./scripts/cross-build.sh

      - name: Upload pak artifact
        uses: actions/upload-artifact@v7
        with:
          name: MeshClient.pak-tg5040-aarch64
          path: |
            dist/MeshClient.pak.zip
            dist/meshclient-tg5040-aarch64
          if-no-files-found: error

  # The desktop and server download, on every pull request, for the reason the job above it
  # exists: a release is the wrong place to discover that something no longer builds against
  # musl. This one is cheap enough not to need the toolchain cache that job has - musl-gcc comes
  # from apt and the static libdbus builds in well under a minute - so it is a plain run of the
  # script the release calls, which is also what makes it a test of that script rather than of a
  # copy of it.
  linux-cli:
    name: Linux CLI (static x86-64, musl)
    runs-on: ubuntu-24.04
    # A few minutes when it works. Without a cap, a hang runs to GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson pkg-config protobuf-compiler python3 python3-pip musl-tools wget file

      - name: Install Python packages for nanopb generator
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools jinja2 jsonschema

      # Asserts the binary is static and still has BlueZ in it before publishing anything; see
      # scripts/linux-cli-build.sh.
      - name: Build the CLI
        run: ./scripts/linux-cli-build.sh

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: meshclient-linux-x86_64
          path: |
            dist/meshclient-linux-x86_64
            dist/meshclient-linux-x86_64.sha256
          if-no-files-found: error

  # The suite again, under AddressSanitizer and UndefinedBehaviorSanitizer. Both options have
  # existed in CMakeLists.txt all along and nothing but a person remembering to type them ever
  # turned them on - on a C17 client whose inputs arrive off the air from radios we do not
  # control, that is the check worth automating first.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libclang-rt-18-dev is the one that is easy to miss: Ubuntu's clang package does not
          # pull the sanitizer runtimes in, and without them the link fails looking for
          # libclang_rt.asan-x86_64.a rather than at anything to do with this code.
          sudo apt-get install -y build-essential clang llvm libclang-rt-18-dev cmake ninja-build pkg-config libdbus-1-dev dbus-daemon protobuf-compiler python3 python3-pip libsdl2-dev

      - name: Install Python packages for nanopb generator
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools jinja2 jsonschema

      # clang for the sanitizer runtimes, and a build root of its own so the sanitized tree
      # never shares a CMake cache with an ordinary Debug configure.
      - name: Build and test
        env:
          CC: clang
          BUILD_ROOT: build/san
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: make test CMAKE_ARGS="-- -DMESHCLIENT_ENABLE_ASAN=ON -DMESHCLIENT_ENABLE_UBSAN=ON"

  # The two doors bytes we did not write come in through: the serial frame parser and the
  # session's FromRadio decode. This is the deterministic half of fuzzing - every seed once,
  # then a fixed number of mutations from a fixed seed - so a red here is a bug in the diff
  # rather than a fuzzer that got lucky on somebody's pull request. The hunt is `make fuzz
  # ARGS="--time 600"`, run by hand when those paths change.
  fuzz:
    name: Fuzz (libFuzzer, seeded regression)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libclang-rt-18-dev carries libFuzzer and the sanitizer runtimes; Ubuntu's clang
          # package does not pull it in, and the link fails looking for libclang_rt.fuzzer.
          sudo apt-get install -y build-essential clang llvm libclang-rt-18-dev cmake ninja-build pkg-config libdbus-1-dev protobuf-compiler python3 python3-pip libsdl2-dev

      - name: Install Python packages for nanopb generator
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools jinja2 jsonschema

      - name: Run the harnesses over their seed corpus
        env:
          CC: clang
        run: ./scripts/fuzz.sh

      # The crashing input is the reproducer, so keep it when there is one.
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: build/fuzz/findings
          if-no-files-found: ignore
