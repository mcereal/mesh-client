name: Semantic Release

# Two decisions, two buttons. A merge releases nothing; a release is pressed - Actions >
# Semantic Release > Run workflow - and the `channel` input picks what kind:
#
#   stable  a release, off `main`, the one the Pak Store and the Stable update channel see
#   beta    a prerelease, off whatever `main` holds right now
#   rc      the same, on the other prerelease name
#
# Binding a release to the merge instead made every pull request one. Sixteen shipped on
# 2026-09-12, which is a Pak Store nagging its users sixteen times, a changelog window (five
# entries, in pak.json) covering eight hours, and a version number that had stopped describing
# anything. semantic-release does the batching for free: it reads every commit since the last
# tag, takes the highest bump among them, and writes one set of notes covering the lot.
#
# The cron is the safety net rather than the schedule: a fix that is merged and unreleased is
# the one thing this trade gives up, so a week is the longest it can sit unnoticed. A genuine
# bug fix does not wait for it - that is what the dispatch is for. Scheduled runs fire on the
# default branch only, which is `main`, which is the one this is for, and they are always
# stable: `github.event.inputs` is null for a cron, so RELEASE_CHANNEL below falls through.
#
# A prerelease is dispatched on `main` like any other release - the branch is plumbing, not a
# place to work. The run points `beta` at the commit being released and tells semantic-release
# to read the config's `beta` entry; see the two steps that do it. The push trigger stays for
# the other way round - merge work to `beta` directly and it publishes a prerelease per merge -
# and in that case the sync step is skipped, because there `beta` is ahead of `main` on purpose.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        default: stable
        options:
          - stable
          - beta
          - rc
  schedule:
    - cron: '0 18 * * 0'
  push:
    branches:
      - beta
      - rc

# One release at a time *per channel*, and a run that has started is never cancelled. The
# channel is in the group rather than out of it because `cancel-in-progress: false` does not
# mean what it reads as: it protects a run that is in progress, while a run still *pending* in
# the group is cancelled by default the moment a newer one queues behind the same busy run.
# Under one literal group that is a prerelease quietly discarding the Sunday cron's queued
# stable run - an unrelated release cancelling the safety net, which is the one failure a safety
# net may not have.
#
# It is keyed on the channel and not on `github.ref`, which is now `main` for all three: a
# dispatch and the cron are both stable, and they can land together the moment somebody presses
# the button on a Sunday evening - two version bumps pushed at one branch tip, or a cancelled
# run leaving a tag with no commit behind it. A pending duplicate lost *within* one channel
# costs nothing, because the run ahead of it has already released everything the second would
# have found.
concurrency:
  group: semantic-release-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.channel || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # The version this run published, or empty when there was nothing to release. Written by
    # release.config.mjs's successCmd; the desktop jobs below build from it.
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    # One name for the three triggers: the dispatch input, the branch a push arrived on, and
    # `stable` for the cron, which has no inputs. Everything below reads this rather than
    # re-deriving it, including release.config.mjs, which decides from it whether the release
    # commits anything back.
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.channel || 'stable' }}
      # Where About's "Send report" sends a crash report. Every configure a release script runs
      # reads it from here (see MESHCLIENT_CRASH_DSN in CMakeLists.txt); unset, a release is
      # built with nowhere to send and simply does not offer the row. Not a secret in the sense
      # of being private - a DSN only lets somebody submit an event - but kept with the others.
      MESHCLIENT_CRASH_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      # "Use workflow from" is a second selector, and it is not the channel. A run launched from
      # `beta` with the channel left at `stable` would take one answer from each: the write-back
      # plugins, which release.config.mjs enables from RELEASE_CHANNEL, and the prerelease
      # branch, which semantic-release reads out of GITHUB_REF. That publishes a prerelease that
      # *commits* a version bump and a CHANGELOG onto the channel branch - the one divergence
      # this whole design exists to avoid, and it would then reject every later sync push.
      #
      # So the input is the only thing that picks a channel, and a dispatch from anywhere but
      # `main` is refused rather than interpreted. Working on `beta` itself is what the push
      # trigger is for.
      - name: Releases are dispatched on main
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "::error::Dispatched from ${GITHUB_REF_NAME}, but a release runs on main."
          echo "Pick the kind of release with the Release channel input, not with 'Use workflow from'." >&2
          exit 1

      # The release pushes to a protected branch, so it needs an identity the ruleset's bypass
      # list names - and that identity must not be sitting in .git/config while the steps below
      # run pip, build a downloaded tarball and execute npm lifecycle scripts. Any one of those
      # is arbitrary third-party code, and a credential that can bypass branch protection is
      # worth far more to it than the scoped per-run token ever was.
      #
      # So checkout keeps no credentials at all, and the push identity appears exactly once: as
      # an env var on the release step itself, below.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # A prerelease dispatched on `main` releases the commit that was checked out; the channel
      # branch only has to name it. So `beta` is moved to this commit before semantic-release
      # looks at it, and moved with a plain push rather than a force: under release.config.mjs a
      # prerelease commits nothing, so this is always a fast-forward, and a *rejection* means
      # somebody has been working on `beta` directly - which is a thing to look at rather than
      # to overwrite, since forcing past it would orphan the commit the last prerelease tag
      # points at.
      #
      # It pushes with the per-run token deliberately: a push made with GITHUB_TOKEN does not
      # trigger workflows, so moving `beta` here cannot also set off this file's own push
      # trigger and release the same commit twice.
      #
      # Skipped for a push, where `beta` is already the branch being released and is ahead of
      # `main` on purpose.
      - name: Point the channel branch at this commit
        if: env.RELEASE_CHANNEL != 'stable' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${RELEASE_CHANNEL}"
          # And locally, so `git tag --merged <channel>` has a ref to read. Same commit; this
          # relabels HEAD rather than moving it.
          git checkout -B "${RELEASE_CHANNEL}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: |
          sudo apt-get update
          # musl-tools is for the third asset rather than the pak: scripts/linux-cli-build.sh
          # builds the static x86-64 CLI with musl-gcc, on this runner, for the desktop and
          # server download. The aarch64 half below is a separate toolchain and untouched by it.
          sudo apt-get install -y build-essential cmake ninja-build meson pkg-config protobuf-compiler python3 python3-pip zip musl-tools file
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools jinja2 jsonschema
          # Bootlin musl toolchain for the static aarch64 build
          wget -q https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2025.08-1.tar.xz
          tar -xf aarch64--musl--stable-2025.08-1.tar.xz
          echo "$PWD/aarch64--musl--stable-2025.08-1/bin" >> $GITHUB_PATH

      - name: Build static libdbus
        run: |
          # libdbus only: message_bus=false skips the daemon, so no XML parser is needed. dbus >= 1.16 is meson-only.
          cat > meson-cross.ini <<'INI'
          [binaries]
          c = 'aarch64-buildroot-linux-musl-gcc'
          ar = 'aarch64-buildroot-linux-musl-ar'
          strip = 'aarch64-buildroot-linux-musl-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          INI
          wget -q https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz
          tar -xf dbus-1.16.2.tar.xz
          cd dbus-1.16.2
          meson setup build --cross-file ../meson-cross.ini \
            --prefix="$PWD/../dbus-install" --libdir=lib --buildtype=release \
            -Ddefault_library=static -Dmessage_bus=false -Dtools=false \
            -Dmodular_tests=disabled -Dintrusive_tests=false -Dinstalled_tests=false \
            -Dxml_docs=disabled -Ddoxygen_docs=disabled -Dducktype_docs=disabled -Dqt_help=disabled \
            -Dselinux=disabled -Dapparmor=disabled -Dsystemd=disabled -Dlibaudit=disabled \
            -Dx11_autolaunch=disabled
          ninja -C build
          ninja -C build install
          # These reach the build through $GITHUB_ENV rather than `export`, because the build
          # no longer runs in a step of its own - it runs inside semantic-release's prepare,
          # after the version has been rewritten. See scripts/release-build.sh.
          DBUS_PREFIX="$(cd .. && pwd)/dbus-install"
          {
            echo "PKG_CONFIG_PATH=$DBUS_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CROSS_COMPILE=aarch64-buildroot-linux-musl-"
            echo "PLATFORM=tg5040"
            echo "DBUS_CFLAGS=-I$DBUS_PREFIX/include/dbus-1.0 -I$DBUS_PREFIX/lib/dbus-1.0/include"
            echo "DBUS_LIBS=-L$DBUS_PREFIX/lib -ldbus-1"
            echo "DBUS_LDFLAGS=-L$DBUS_PREFIX/lib"
          } >> $GITHUB_ENV

      - name: Install semantic-release
        run: npm install --no-fund --no-audit

      # Builds too: semantic-release's prepare step rewrites the version in CMakeLists.txt and
      # then runs scripts/release-build.sh, so the assets it publishes are built from the
      # version being released rather than the one before it.
      - name: Run semantic-release
        id: semantic-release
        env:
          # Which of release.config.mjs's branches this run is. semantic-release takes the
          # branch from one place and one place only - env-ci reads GITHUB_REF and nothing else
          # (env-ci/services/github.js) - so a prerelease dispatched on `main` has to say so,
          # or it would be read as a stable release of `main` and publish one. The step above
          # has already pointed that branch at this commit, so the two agree; for a stable
          # release, and for a push that arrived on `beta`, this is the ref the run already had.
          #
          # It is spelled RELEASE_REF here and assigned to GITHUB_REF on the `run:` line below,
          # rather than named GITHUB_REF in this block, because a step's `env:` cannot override
          # a GITHUB_-prefixed variable: the runner sets those itself, after this block, so the
          # value here is silently discarded. A beta dispatch on 2026-09-17 read its branch as
          # `main` and published v2.71.0 as a *stable* release - while release.config.mjs, which
          # reads RELEASE_CHANNEL and not GITHUB_REF, correctly dropped the write-back plugins,
          # so that release carried no version bump, no CHANGELOG entry and no pak.json. A shell
          # assignment on the command line is applied when the process is spawned, which is
          # after the runner is done, and is the only form that reaches semantic-release.
          RELEASE_REF: ${{ env.RELEASE_CHANNEL == 'stable' && github.ref || format('refs/heads/{0}', env.RELEASE_CHANNEL) }}
          # The API identity: the release, its assets, and the comments the GitHub plugin
          # posts. The ruleset guards the branch and not the releases, so this stays the scoped
          # per-run token - and the release goes on being published by github-actions[bot], as
          # every release before it was.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The push identity, and the reason this workflow works at all: `main` requires status
          # checks that a direct push can never satisfy, so whoever pushes the version bump has
          # to be on the ruleset's bypass list. semantic-release builds the authenticated remote
          # from the first of GIT_CREDENTIALS, GH_TOKEN, GITHUB_TOKEN that can push
          # (lib/get-git-auth-url.js), so naming it here is what makes @semantic-release/git use
          # the PAT rather than the token above.
          #
          # The username half is ignored by GitHub; the token is the password. The fallback
          # keeps this honest before the secret exists - the push is then refused by the ruleset
          # exactly as it is today, rather than failing in some new way.
          GIT_CREDENTIALS: x-access-token:${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
        run: GITHUB_REF="${RELEASE_REF}" npx semantic-release

      # The debug files a sent crash report is symbolicated against: the handheld's binary and
      # the Linux CLI as they shipped, for their symbol tables, and the debug info split off
      # each (dist/symbols/, never published) for file and line. Sentry matches them to a report
      # by build id, which every Linux binary here is linked with. Skipped until the
      # SENTRY_AUTH_TOKEN secret exists, and never fatal - a release without symbols is still a
      # release.
      - name: Upload debug files to Sentry
        if: steps.semantic-release.outputs.version != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "No SENTRY_AUTH_TOKEN; not uploading debug files."
            exit 0
          fi
          files=()
          for f in dist/meshclient-tg5040-aarch64 dist/meshclient-linux-* dist/symbols/*.debug; do
            case "$f" in *.sha256) ;; *) [ -f "$f" ] && files+=("$f") ;; esac
          done
          npx --yes @sentry/cli@2 debug-files upload "${files[@]}"

  # The macOS and Windows downloads, which need a Mac and a Windows machine to build, so they
  # cannot be made inside semantic-release's prepare step with the rest. They are built from the
  # tag the job above just pushed, stamped with the same version, and attached to its release.
  #
  # So a release is briefly published without them. A desktop client that checks in that window
  # reads "No usable release asset" and finds the update on its next check; the handheld is
  # never affected, because its assets were published with the release itself.
  #
  # Re-running one of these jobs is safe: --clobber replaces an asset that is already there.
  macos:
    name: macOS download
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      MESHCLIENT_CRASH_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: ./scripts/setup-macos.sh

      # The certificate is exported with its private key as a password-protected .p12. Keep it
      # out of the checkout and import it only into this job's temporary keychain.
      - name: Install Developer ID signing identity
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/meshclient-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode -o "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          identity="$(security find-identity -v -p codesigning "${keychain_path}" |
            awk -v team="${APPLE_TEAM_ID}" \
              'index($0, "Developer ID Application:") && index($0, "(" team ")") { print $2; exit }')"
          if [[ -z "${identity}" ]]; then
            echo "::error::No valid Developer ID Application identity for team ${APPLE_TEAM_ID}." >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          rm -f "${certificate_path}"

      - name: Build the bundle and the disk image
        run: ./scripts/package-macos.sh "${VERSION}"

      - name: Notarize and staple the disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/meshclient-notarization.json"
          xcrun notarytool submit dist/MeshClient-macos.dmg \
            --apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" --wait --output-format json > "${result}"
          status="$(jq -r '.status // empty' "${result}")"
          if [[ "${status}" != "Accepted" ]]; then
            submission_id="$(jq -r '.id // empty' "${result}")"
            if [[ -n "${submission_id}" ]]; then
              xcrun notarytool log "${submission_id}" \
                --apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
                --team-id "${APPLE_TEAM_ID}" || true
            fi
            echo "::error::Apple notarization status: ${status:-unknown}." >&2
            exit 1
          fi
          xcrun stapler staple dist/MeshClient-macos.dmg
          xcrun stapler validate dist/MeshClient-macos.dmg
          ( cd dist && shasum -a 256 MeshClient-macos.dmg > MeshClient-macos.dmg.sha256 )

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --clobber \
            dist/MeshClient-macos.dmg dist/MeshClient-macos.dmg.sha256 \
            dist/MeshClient-macos-app.zip dist/MeshClient-macos-app.zip.sha256

      # The Mac binary's symbols, matched to a report by its LC_UUID: the binary for its symbol
      # table and the dSYM for file and line. As in the release job: skipped without a token,
      # never fatal.
      - name: Upload debug files to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "No SENTRY_AUTH_TOKEN; not uploading debug files."
            exit 0
          fi
          npx --yes @sentry/cli@2 debug-files upload build/macos-release/meshclient build/macos-release/meshclient.dSYM

  windows:
    name: Windows download
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.release.outputs.version }}
      MESHCLIENT_CRASH_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Preserve Unix line endings and enable long Git paths
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          submodules: false
          persist-credentials: false

      - name: Install UCRT64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-python-protobuf
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-python-jsonschema

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/setup-windows.ps1
          ./scripts/package-windows.ps1 -Version $env:VERSION

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --clobber `
            dist/MeshClient-windows-x86_64-setup.exe dist/MeshClient-windows-x86_64-setup.exe.sha256 `
            dist/meshclient-windows-x86_64.exe dist/meshclient-windows-x86_64.exe.sha256
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed.' }

      # The packaged EXE is copied from this unstripped build output. Its DWARF and RSDS debug
      # id let Sentry match the PE image in a Windows crash report to this exact release build.
      - name: Upload debug files to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN) {
            Write-Host 'No SENTRY_AUTH_TOKEN; not uploading debug files.'
            exit 0
          }
          npx --yes @sentry/cli@2 debug-files upload build/windows-release/meshclient.exe
          if ($LASTEXITCODE -ne 0) { throw 'Sentry debug file upload failed.' }
