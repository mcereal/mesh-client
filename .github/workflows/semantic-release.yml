name: Semantic Release

on:
  push:
    branches:
      - main
      - beta
      - rc

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config protobuf-compiler python3 python3-pip zip
          # Install Python protobuf before downloading toolchain
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools
          # Download and extract Bootlin musl toolchain for ARM cross-compilation
          wget https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2024.02-1.tar.bz2
          tar -xf aarch64--musl--stable-2024.02-1.tar.bz2
          # Add toolchain to PATH immediately for libdbus build
          export PATH="$PWD/aarch64--musl--stable-2024.02-1/bin:$PATH"
          echo "$PWD/aarch64--musl--stable-2024.02-1/bin" >> $GITHUB_PATH
          # Build expat (required by libdbus) from source
          wget https://github.com/libexpat/libexpat/releases/download/R_2_5_0/expat-2.5.0.tar.xz
          tar -xf expat-2.5.0.tar.xz
          cd expat-2.5.0
          ./configure --host=aarch64-buildroot-linux-musl \
            CC=aarch64-buildroot-linux-musl-gcc \
            AR=aarch64-buildroot-linux-musl-ar \
            RANLIB=aarch64-buildroot-linux-musl-ranlib \
            --prefix=$PWD/../expat-install \
            --disable-shared --enable-static \
            --without-docbook
          make -j$(nproc)
          make install
          cd ..
          # Build libdbus from source for static linking
          export PKG_CONFIG_PATH="$PWD/expat-install/lib/pkgconfig:$PKG_CONFIG_PATH"
          wget https://dbus.freedesktop.org/releases/dbus/dbus-1.14.10.tar.xz
          tar -xf dbus-1.14.10.tar.xz
          cd dbus-1.14.10
          ./configure --host=aarch64-buildroot-linux-musl \
            CC=aarch64-buildroot-linux-musl-gcc \
            AR=aarch64-buildroot-linux-musl-ar \
            RANLIB=aarch64-buildroot-linux-musl-ranlib \
            --prefix=$PWD/../dbus-install \
            --disable-shared --enable-static \
            --disable-tests --disable-doxygen-docs \
            --disable-xml-docs --disable-selinux \
            --disable-systemd --disable-traditional-activation \
            --without-x \
            EXPAT_CFLAGS="-I$PWD/../expat-install/include" \
            EXPAT_LIBS="-L$PWD/../expat-install/lib -lexpat"
          make -j$(nproc)
          make install
          cd ..
          export PKG_CONFIG_PATH="$PWD/dbus-install/lib/pkgconfig:$PKG_CONFIG_PATH"
          echo "PKG_CONFIG_PATH=$PWD/dbus-install/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@^23.0.0 \
            @semantic-release/changelog@^6.0.3 \
            @semantic-release/git@^10.0.1 \
            @semantic-release/exec@^6.0.3 \
            conventional-changelog-conventionalcommits@^7.0.2

      - name: Build (Release)
        run: |
          export CROSS_COMPILE=aarch64-buildroot-linux-musl-
          # Use system Python3 (not toolchain's) for nanopb code generation
          SYSTEM_PYTHON=$(which -a python3 | grep -v aarch64 | head -n1)
          # Set up D-Bus paths for cross-compilation
          export DBUS_CFLAGS="-I$PWD/dbus-install/include/dbus-1.0 -I$PWD/dbus-install/lib/dbus-1.0/include"
          export DBUS_LIBS="-L$PWD/dbus-install/lib -ldbus-1"
          cmake -S . -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-buildroot-linux-musl-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-buildroot-linux-musl-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_EXE_LINKER_FLAGS="-static -L$PWD/dbus-install/lib" \
            -DCMAKE_C_FLAGS="-Os $DBUS_CFLAGS" \
            -DPython3_EXECUTABLE="$SYSTEM_PYTHON"
          cmake --build build/release

      - name: Package Pak
        run: |
          export CROSS_COMPILE=aarch64-buildroot-linux-musl-
          export PLATFORM=tg5040
          make package

      - name: Compute checksums
        run: |
          (cd dist && sha256sum MeshClient.pak.zip > MeshClient.pak.zip.sha256)

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
        run: npx semantic-release
