name: Semantic Release

on:
  push:
    branches:
      - main
      - beta
      - rc

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # The release pushes to a protected branch, so it needs an identity the ruleset's bypass
      # list names - and that identity must not be sitting in .git/config while the steps below
      # run pip, build a downloaded tarball and execute npm lifecycle scripts. Any one of those
      # is arbitrary third-party code, and a credential that can bypass branch protection is
      # worth far more to it than the scoped per-run token ever was.
      #
      # So checkout keeps no credentials at all, and the push identity appears exactly once: as
      # an env var on the release step itself, below.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson pkg-config protobuf-compiler python3 python3-pip zip
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user protobuf grpcio-tools
          # Bootlin musl toolchain for the static aarch64 build
          wget -q https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2025.08-1.tar.xz
          tar -xf aarch64--musl--stable-2025.08-1.tar.xz
          echo "$PWD/aarch64--musl--stable-2025.08-1/bin" >> $GITHUB_PATH

      - name: Build static libdbus
        run: |
          # libdbus only: message_bus=false skips the daemon, so no XML parser is needed. dbus >= 1.16 is meson-only.
          cat > meson-cross.ini <<'INI'
          [binaries]
          c = 'aarch64-buildroot-linux-musl-gcc'
          ar = 'aarch64-buildroot-linux-musl-ar'
          strip = 'aarch64-buildroot-linux-musl-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          INI
          wget -q https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz
          tar -xf dbus-1.16.2.tar.xz
          cd dbus-1.16.2
          meson setup build --cross-file ../meson-cross.ini \
            --prefix="$PWD/../dbus-install" --libdir=lib --buildtype=release \
            -Ddefault_library=static -Dmessage_bus=false -Dtools=false \
            -Dmodular_tests=disabled -Dintrusive_tests=false -Dinstalled_tests=false \
            -Dxml_docs=disabled -Ddoxygen_docs=disabled -Dducktype_docs=disabled -Dqt_help=disabled \
            -Dselinux=disabled -Dapparmor=disabled -Dsystemd=disabled -Dlibaudit=disabled \
            -Dx11_autolaunch=disabled
          ninja -C build
          ninja -C build install
          # These reach the build through $GITHUB_ENV rather than `export`, because the build
          # no longer runs in a step of its own - it runs inside semantic-release's prepare,
          # after the version has been rewritten. See scripts/release-build.sh.
          DBUS_PREFIX="$(cd .. && pwd)/dbus-install"
          {
            echo "PKG_CONFIG_PATH=$DBUS_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CROSS_COMPILE=aarch64-buildroot-linux-musl-"
            echo "PLATFORM=tg5040"
            echo "DBUS_CFLAGS=-I$DBUS_PREFIX/include/dbus-1.0 -I$DBUS_PREFIX/lib/dbus-1.0/include"
            echo "DBUS_LIBS=-L$DBUS_PREFIX/lib -ldbus-1"
            echo "DBUS_LDFLAGS=-L$DBUS_PREFIX/lib"
          } >> $GITHUB_ENV

      - name: Install semantic-release
        run: npm install --no-fund --no-audit

      # Builds too: semantic-release's prepare step rewrites the version in CMakeLists.txt and
      # then runs scripts/release-build.sh, so the assets it publishes are built from the
      # version being released rather than the one before it.
      - name: Run semantic-release
        env:
          # The API identity: the release, its assets, and the comments the GitHub plugin
          # posts. The ruleset guards the branch and not the releases, so this stays the scoped
          # per-run token - and the release goes on being published by github-actions[bot], as
          # every release before it was.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The push identity, and the reason this workflow works at all: `main` requires status
          # checks that a direct push can never satisfy, so whoever pushes the version bump has
          # to be on the ruleset's bypass list. semantic-release builds the authenticated remote
          # from the first of GIT_CREDENTIALS, GH_TOKEN, GITHUB_TOKEN that can push
          # (lib/get-git-auth-url.js), so naming it here is what makes @semantic-release/git use
          # the PAT rather than the token above.
          #
          # The username half is ignored by GitHub; the token is the password. The fallback
          # keeps this honest before the secret exists - the push is then refused by the ruleset
          # exactly as it is today, rather than failing in some new way.
          GIT_CREDENTIALS: x-access-token:${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
        run: npx semantic-release
