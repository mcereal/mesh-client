version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # 10.x needs conventional-changelog-writer@9; semantic-release 25's
      # release-notes-generator/commit-analyzer still bundle writer@8.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10"]
